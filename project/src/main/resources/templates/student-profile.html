<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: student-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><p class="eyebrow text-primary mb-2">Personal profile</p><h1 class="display-6 fw-bold mb-2">Your profile</h1><p class="text-muted mb-0">This information helps us find stronger internship matches.</p></div></section><section class="section-space pt-4"><div class="container"><div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" data-auto-hide="5000" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" data-auto-hide="7000" th:text="${errorMessage}"></div><div class="row g-4"><div class="col-lg-4"><div class="panel p-4 text-center"><img id="photoPreview" class="profile-avatar profile-avatar-lg mb-3" th:if="${student.profilePhoto != null}" th:src="@{'/images/uploads/' + ${student.profilePhoto}}" alt="Profile photo" style="display:block"><div class="profile-avatar profile-avatar-lg d-flex align-items-center justify-content-center mx-auto mb-3" th:if="${student.profilePhoto == null}"><i class="bi bi-person fs-1 text-primary"></i></div><h2 class="h4" th:text="${student.name}">Student</h2><p class="text-muted" th:text="${student.email}">Email</p><form th:action="@{/student/profile/photo}" method="post" enctype="multipart/form-data" class="text-start mt-4"><label class="form-label">Update profile photo</label><input id="photoInput" class="form-control form-control-sm" type="file" name="photo" accept="image/*" aria-label="Choose profile photo"><button class="btn btn-soft btn-sm w-100 mt-2" type="submit">Upload photo</button></form></div></div><div class="col-lg-8"><div class="panel p-4 p-md-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow text-primary mb-2">Details</p><h2 class="h4 mb-0">Profile information</h2></div><a class="btn btn-primary" th:href="@{/student/profile/edit}">Edit profile</a></div><div class="row g-4"><div class="col-md-6"><span class="detail-label">Department</span><div class="detail-value" th:text="${student.department}">Department</div></div><div class="col-md-6"><span class="detail-label">Year</span><div class="detail-value" th:text="${student.year}">Year</div></div><div class="col-md-6"><span class="detail-label">CGPA</span><div class="detail-value" th:text="${student.cgpa}">CGPA</div></div><div class="col-md-6"><span class="detail-label">Phone</span><div class="detail-value" th:text="${student.phone}">Phone</div></div><div class="col-12"><span class="detail-label d-block mb-2">Skills</span><p class="mb-0" th:text="${student.skills}">Skills</p></div><div class="col-12"><span class="detail-label d-block mb-2">Interests</span><p class="mb-0" th:text="${student.interests}">Interests</p></div></div></div></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
