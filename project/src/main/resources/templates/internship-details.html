<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: student-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><a class="text-primary text-decoration-none small" th:href="@{/internships}"><i class="bi bi-arrow-left me-1"></i>Back to internships</a></div></section><section class="section-space pt-4"><div class="container"><div class="panel p-4 p-md-5"><div class="row g-5"><div class="col-lg-8"><div class="d-flex gap-3 align-items-start mb-4"><div class="company-badge" th:text="${#strings.substring(internship.companyName, 0, 1).toUpperCase()}">A</div><div><p class="eyebrow text-primary mb-2" th:text="${internship.companyName}">Company</p><h1 class="display-6 fw-bold mb-2" th:text="${internship.role}">Role</h1><span class="text-muted"><i class="bi bi-geo-alt me-1"></i><span th:text="${internship.location}">Location</span></span></div></div><h2 class="h5 mt-5">About this opportunity</h2><p class="text-muted" th:text="${internship.description}">Description</p><h2 class="h5 mt-4">Required skills</h2><div><span class="skill-pill" th:each="skill : ${#strings.arraySplit(internship.requiredSkills, ',')}" th:text="${skill}">Skill</span></div></div><div class="col-lg-4"><div class="bg-light rounded-4 p-4"><div class="mb-4"><span class="detail-label">Minimum CGPA</span><div class="detail-value fs-5" th:text="${internship.minimumCgpa}">0</div></div><div class="mb-4"><span class="detail-label">Interest area</span><div class="detail-value" th:text="${internship.interest}">Interest</div></div><div class="mb-4"><span class="detail-label">Duration</span><div class="detail-value" th:text="${internship.duration}">Duration</div></div><div class="mb-4"><span class="detail-label">Stipend</span><div class="detail-value text-success" th:text="${internship.stipend}">Stipend</div></div><div><span class="detail-label">Last date to apply</span><div class="detail-value" th:text="${internship.lastDate != null ? internship.lastDate : 'Open'}">Date</div></div></div><a class="btn btn-primary w-100 mt-3" th:if="${session.studentId != null}" th:href="@{'/student/recommendations/' + ${internship.id}}">View my recommendation</a><a class="btn btn-soft w-100 mt-3" th:if="${session.studentId == null}" th:href="@{/student/login}">Sign in for your match</a></div></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
