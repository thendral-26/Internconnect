<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: admin-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3"><div><p class="eyebrow text-primary mb-2">Opportunity management</p><h1 class="display-6 fw-bold mb-2">Internships</h1><p class="text-muted mb-0">Keep the opportunity catalogue accurate and useful.</p></div><a class="btn btn-primary" th:href="@{/admin/internships/add}"><i class="bi bi-plus-lg me-2"></i>Add internship</a></div></section><section class="section-space pt-4"><div class="container"><div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" data-auto-hide="5000" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" data-auto-hide="7000" th:text="${errorMessage}"></div><div class="panel table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Company</th><th>Role</th><th>Location</th><th>Min. CGPA</th><th>Last date</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="internship : ${internships}"><td th:text="${internship.id}">1</td><td class="fw-semibold" th:text="${internship.companyName}">Company</td><td th:text="${internship.role}">Role</td><td th:text="${internship.location}">Location</td><td th:text="${internship.minimumCgpa}">7</td><td th:text="${internship.lastDate != null ? internship.lastDate : 'Open'}">Date</td><td class="text-end"><a class="btn btn-sm btn-soft me-1" th:href="@{'/admin/internships/edit/' + ${internship.id}}"><i class="bi bi-pencil"></i></a><form class="d-inline" data-confirm-delete th:action="@{'/admin/internships/delete/' + ${internship.id}}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(internships)}"><td colspan="7" class="text-center text-muted py-5">No internships have been added yet.</td></tr></tbody></table></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
