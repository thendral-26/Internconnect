<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: admin-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><p class="eyebrow text-primary mb-2">Platform insights</p><h1 class="display-6 fw-bold mb-2">Recommendations</h1><p class="text-muted mb-0">See how students and opportunities are connecting.</p></div></section><section class="section-space pt-4"><div class="container"><div class="panel table-responsive"><table class="table align-middle"><thead><tr><th>Student</th><th>Email</th><th>Internship</th><th>Company</th><th>Match</th></tr></thead><tbody><tr th:each="recommendation : ${recommendations}"><td class="fw-semibold" th:text="${studentsById[recommendation.studentId] != null ? studentsById[recommendation.studentId].name : 'Student'}">Student</td><td th:text="${studentsById[recommendation.studentId] != null ? studentsById[recommendation.studentId].email : '—'}">Email</td><td th:text="${internshipsById[recommendation.internshipId] != null ? internshipsById[recommendation.internshipId].role : 'Internship'}">Role</td><td th:text="${internshipsById[recommendation.internshipId] != null ? internshipsById[recommendation.internshipId].companyName : '—'}">Company</td><td style="min-width:180px"><div class="d-flex justify-content-between small mb-1"><span class="badge badge-recommended rounded-pill" th:if="${recommendation.matchPercentage >= 70}">Recommended</span><span class="badge badge-not rounded-pill" th:if="${recommendation.matchPercentage < 70}">Review</span><strong th:text="${recommendation.matchPercentage + '%'}">85%</strong></div><div class="progress"><div class="progress-bar" th:classappend="${recommendation.matchPercentage >= 70 ? ' progress-bar-high' : (recommendation.matchPercentage >= 50 ? ' progress-bar-mid' : ' progress-bar-low')}" th:style="${'width:' + recommendation.matchPercentage + '%'}"></div></div></td></tr><tr th:if="${#lists.isEmpty(recommendations)}"><td colspan="5" class="text-center text-muted py-5">Recommendations will appear after students generate matches.</td></tr></tbody></table></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
