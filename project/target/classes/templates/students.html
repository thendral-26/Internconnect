<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: admin-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><p class="eyebrow text-primary mb-2">Student directory</p><h1 class="display-6 fw-bold mb-2">Students</h1><p class="text-muted mb-0">Review the profiles using the recommendation platform.</p></div></section><section class="section-space pt-4"><div class="container"><div class="panel table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Student</th><th>Email</th><th>Department</th><th>Year</th><th>CGPA</th><th>Skills</th><th>Interests</th><th>Phone</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.id}">1</td><td class="fw-semibold" th:text="${student.name}">Name</td><td th:text="${student.email}">Email</td><td th:text="${student.department}">Department</td><td th:text="${student.year}">Year</td><td th:text="${student.cgpa}">8</td><td class="small" th:text="${student.skills}">Skills</td><td class="small" th:text="${student.interests}">Interests</td><td th:text="${student.phone}">Phone</td></tr><tr th:if="${#lists.isEmpty(students)}"><td colspan="9" class="text-center text-muted py-5">No students have registered yet.</td></tr></tbody></table></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
