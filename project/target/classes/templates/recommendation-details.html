<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: student-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><a class="text-primary text-decoration-none small" th:href="@{/student/recommendations}"><i class="bi bi-arrow-left me-1"></i>Back to recommendations</a></div></section><section class="section-space pt-4"><div class="container"><div class="panel p-4 p-md-5"><div class="row g-5"><div class="col-lg-7"><p class="eyebrow text-primary mb-2" th:text="${recommendation.internship.companyName}">Company</p><h1 class="display-6 fw-bold mb-2" th:text="${recommendation.internship.role}">Role</h1><p class="text-muted"><i class="bi bi-geo-alt me-1"></i><span th:text="${recommendation.internship.location}">Location</span></p><h2 class="h5 mt-5">Why this is a match</h2><p class="text-muted" th:text="${recommendation.internship.description}">Description</p><div class="row g-4 mt-2"><div class="col-sm-6"><span class="detail-label d-block mb-2">Matching skills</span><span class="skill-pill" th:each="skill : ${recommendation.matchingSkills}" th:text="${skill}">Skill</span></div><div class="col-sm-6"><span class="detail-label d-block mb-2">Skills to build</span><span class="skill-pill" th:each="skill : ${recommendation.missingSkills}" th:text="${skill}">Skill</span></div></div></div><div class="col-lg-5"><div class="bg-light rounded-4 p-4 text-center"><span class="detail-label">Your match score</span><div class="display-1 font-display fw-bold text-primary my-2" th:text="${recommendation.matchPercentage + '%'}">85%</div><span class="badge rounded-pill" th:classappend="${recommendation.status == 'Recommended' ? ' badge-recommended' : ' badge-not'}" th:text="${recommendation.status}">Recommended</span><div class="progress mt-4"><div class="progress-bar" th:classappend="${recommendation.matchPercentage >= 70 ? ' progress-bar-high' : (recommendation.matchPercentage >= 50 ? ' progress-bar-mid' : ' progress-bar-low')}" th:style="${'width:' + recommendation.matchPercentage + '%'}" th:attr="aria-valuenow=${recommendation.matchPercentage},aria-valuemin=0,aria-valuemax=100"></div></div></div><div class="mt-4"><div class="d-flex justify-content-between py-2 border-bottom"><span class="text-muted">Minimum CGPA</span><strong th:text="${recommendation.internship.minimumCgpa}">7</strong></div><div class="d-flex justify-content-between py-2 border-bottom"><span class="text-muted">Interest</span><strong th:text="${recommendation.internship.interest}">Interest</strong></div><div class="d-flex justify-content-between py-2"><span class="text-muted">Stipend</span><strong class="text-success" th:text="${recommendation.internship.stipend}">Stipend</strong></div></div></div></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
