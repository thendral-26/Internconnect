<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: student-nav}"></div><main class="auth-wrap flex-grow-1"><div class="container"><div class="auth-card card"><div class="text-center mb-4"><div class="icon-box mx-auto mb-3"><i class="bi bi-person-plus"></i></div><h1 class="h3 fw-bold">Create your student account</h1><p class="text-muted mb-0">Build your profile and discover better-fit internships.</p></div><div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" data-auto-hide="7000" th:text="${errorMessage}"></div><form th:action="@{/student/register}" th:object="${studentRegistrationDTO}" method="post" data-validate novalidate><div class="row g-3"><div class="col-12"><label class="form-label">Full name</label><input class="form-control" th:field="*{name}" placeholder="Your name"><div class="text-danger small mt-1" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" th:field="*{email}" placeholder="you@example.com"><div class="text-danger small mt-1" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label" for="registerPassword"><i class="bi bi-lock me-1 text-primary"></i>Password</label><div class="input-group"><input id="registerPassword" type="password" class="form-control" th:field="*{password}" placeholder="At least 6 characters" required><button class="btn password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Show password"><i class="bi bi-eye"></i></button></div><div class="text-danger small mt-1" th:errors="*{password}"></div></div><div class="col-md-6"><label class="form-label">Department</label><input class="form-control" th:field="*{department}" placeholder="Computer Science"><div class="text-danger small mt-1" th:errors="*{department}"></div></div><div class="col-md-6"><label class="form-label">Year</label><input class="form-control" th:field="*{year}" placeholder="Final year"><div class="text-danger small mt-1" th:errors="*{year}"></div></div><div class="col-md-6"><label class="form-label">CGPA</label><input id="registerCgpa" type="number" min="0" max="10" step="0.01" class="form-control" th:field="*{cgpa}" data-cgpa placeholder="0.00 - 10.00" required><div class="text-danger small mt-1" th:errors="*{cgpa}"></div></div><div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control" th:field="*{phone}" placeholder="10-digit number"><div class="text-danger small mt-1" th:errors="*{phone}"></div></div><div class="col-12"><label class="form-label">Skills <span class="text-muted fw-normal">(comma separated)</span></label><input class="form-control" th:field="*{skills}" placeholder="Java, SQL, HTML"><div class="text-danger small mt-1" th:errors="*{skills}"></div></div><div class="col-12"><label class="form-label">Interests <span class="text-muted fw-normal">(comma separated)</span></label><input class="form-control" th:field="*{interests}" placeholder="Web development, data science"><div class="text-danger small mt-1" th:errors="*{interests}"></div></div></div><button class="btn btn-primary w-100 mt-4 py-2" type="submit">Create account</button></form><p class="text-center text-muted mt-4 mb-0">Already registered? <a class="text-primary fw-semibold" th:href="@{/student/login}">Sign in</a></p></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
