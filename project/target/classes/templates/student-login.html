<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: student-nav}"></div><main class="auth-wrap flex-grow-1"><div class="container"><div class="auth-card card"><div class="text-center mb-4"><div class="icon-box mx-auto mb-3"><i class="bi bi-person-circle"></i></div><h1 class="h3 fw-bold">Welcome back</h1><p class="text-muted mb-0">Sign in to continue your internship journey.</p></div><div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" data-auto-hide="5000" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" data-auto-hide="7000" th:text="${errorMessage}"></div><form th:action="@{/student/login}" th:object="${studentLoginDTO}" method="post" data-validate><div class="mb-3"><label class="form-label" for="email"><i class="bi bi-envelope me-1 text-primary"></i>Email</label><input id="email" type="email" class="form-control" th:field="*{email}" placeholder="you@example.com" required><div class="text-danger small mt-1" th:errors="*{email}"></div></div><div class="mb-4"><label class="form-label" for="password"><i class="bi bi-lock me-1 text-primary"></i>Password</label><div class="input-group"><input id="password" type="password" class="form-control" th:field="*{password}" placeholder="Your password" required><button class="btn password-toggle" type="button" data-password-toggle="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div><div class="text-danger small mt-1" th:errors="*{password}"></div></div><button class="btn btn-primary w-100 py-2" type="submit">Sign in <i class="bi bi-arrow-right ms-2"></i></button></form><p class="text-center text-muted mt-4 mb-0">New here? <a class="text-primary fw-semibold" th:href="@{/student/register}">Create an account</a></p></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
