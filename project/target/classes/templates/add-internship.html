<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: admin-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><p class="eyebrow text-primary mb-2">Opportunity management</p><h1 class="display-6 fw-bold mb-2">Add internship</h1><p class="text-muted mb-0">Publish a clear opportunity for students to discover.</p></div></section><section class="section-space pt-4"><div class="container"><div class="panel p-4 p-md-5"><form th:action="@{/admin/internships/add}" th:object="${internshipDTO}" method="post" data-validate><div class="row g-4"><div class="col-md-6"><label class="form-label" for="companyName">Company name</label><input id="companyName" class="form-control" th:field="*{companyName}" placeholder="Company" required><div class="text-danger small" th:errors="*{companyName}"></div></div><div class="col-md-6"><label class="form-label" for="role">Role</label><input id="role" class="form-control" th:field="*{role}" placeholder="Software Engineering Intern" required><div class="text-danger small" th:errors="*{role}"></div></div><div class="col-md-6"><label class="form-label">Required skills</label><input class="form-control" th:field="*{requiredSkills}" placeholder="Java, SQL, Git"><div class="text-danger small" th:errors="*{requiredSkills}"></div></div><div class="col-md-6"><label class="form-label">Minimum CGPA</label><input id="minimumCgpa" class="form-control" type="number" min="0" max="10" step="0.01" th:field="*{minimumCgpa}" data-cgpa placeholder="7.0"><div class="text-danger small" th:errors="*{minimumCgpa}"></div></div><div class="col-md-6"><label class="form-label">Interest area</label><input class="form-control" th:field="*{interest}" placeholder="Web development"><div class="text-danger small" th:errors="*{interest}"></div></div><div class="col-md-6"><label class="form-label">Location</label><input class="form-control" th:field="*{location}" placeholder="Bengaluru / Remote"><div class="text-danger small" th:errors="*{location}"></div></div><div class="col-md-6"><label class="form-label">Duration</label><input class="form-control" th:field="*{duration}" placeholder="3 months"><div class="text-danger small" th:errors="*{duration}"></div></div><div class="col-md-6"><label class="form-label">Stipend</label><input class="form-control" th:field="*{stipend}" placeholder="₹25,000 / month"><div class="text-danger small" th:errors="*{stipend}"></div></div><div class="col-md-6"><label class="form-label" for="lastDate">Last date to apply</label><input id="lastDate" class="form-control" type="date" th:field="*{lastDate}" data-future-date></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="5" th:field="*{description}" placeholder="Describe the opportunity..."></textarea><div class="text-danger small" th:errors="*{description}"></div></div></div><div class="d-flex flex-wrap gap-2 mt-5"><button class="btn btn-primary px-4" type="submit">Publish internship</button><a class="btn btn-light border px-4" th:href="@{/admin/internships}">Cancel</a></div></form></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
