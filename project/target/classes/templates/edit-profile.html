<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: student-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><p class="eyebrow text-primary mb-2">Personal profile</p><h1 class="display-6 fw-bold mb-2">Edit your profile</h1><p class="text-muted mb-0">Keep your details current so recommendations stay relevant.</p></div></section><section class="section-space pt-4"><div class="container"><div class="panel p-4 p-md-5"><form th:action="@{/student/profile/update}" th:object="${student}" method="post" data-validate><div class="row g-4"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" th:field="*{name}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" th:value="${student.email}" disabled></div><div class="col-md-6"><label class="form-label">Department</label><input class="form-control" th:field="*{department}"></div><div class="col-md-6"><label class="form-label">Year</label><input class="form-control" th:field="*{year}"></div><div class="col-md-6"><label class="form-label">CGPA</label><input type="number" min="0" max="10" step="0.01" class="form-control" th:field="*{cgpa}" data-cgpa></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-6"><label class="form-label">Skills</label><input class="form-control" th:field="*{skills}" placeholder="Java, SQL, HTML"></div><div class="col-md-6"><label class="form-label">Interests</label><input class="form-control" th:field="*{interests}" placeholder="Web development, data science"></div></div><div class="d-flex flex-wrap gap-2 mt-5"><button class="btn btn-primary px-4" type="submit">Save changes</button><a class="btn btn-light border px-4" th:href="@{/student/profile}">Cancel</a></div></form></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
