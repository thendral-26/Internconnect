<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head}"></head><body class="app-shell"><div th:replace="~{fragments/navbar :: admin-nav}"></div><main class="flex-grow-1"><section class="page-header"><div class="container"><p class="eyebrow text-primary mb-2">Opportunity management</p><h1 class="display-6 fw-bold mb-2">Edit internship</h1><p class="text-muted mb-0">Update the listing details shown to students.</p></div></section><section class="section-space pt-4"><div class="container"><div class="panel p-4 p-md-5"><form th:action="@{'/admin/internships/edit/' + ${internshipDTO.id}}" th:object="${internshipDTO}" method="post" data-validate><div class="row g-4"><div class="col-md-6"><label class="form-label">Company name</label><input class="form-control" th:field="*{companyName}"><div class="text-danger small" th:errors="*{companyName}"></div></div><div class="col-md-6"><label class="form-label">Role</label><input class="form-control" th:field="*{role}"><div class="text-danger small" th:errors="*{role}"></div></div><div class="col-md-6"><label class="form-label">Required skills</label><input class="form-control" th:field="*{requiredSkills}"><div class="text-danger small" th:errors="*{requiredSkills}"></div></div><div class="col-md-6"><label class="form-label">Minimum CGPA</label><input id="minimumCgpa" class="form-control" type="number" min="0" max="10" step="0.01" th:field="*{minimumCgpa}" data-cgpa><div class="text-danger small" th:errors="*{minimumCgpa}"></div></div><div class="col-md-6"><label class="form-label">Interest area</label><input class="form-control" th:field="*{interest}"><div class="text-danger small" th:errors="*{interest}"></div></div><div class="col-md-6"><label class="form-label">Location</label><input class="form-control" th:field="*{location}"></div><div class="col-md-6"><label class="form-label">Duration</label><input class="form-control" th:field="*{duration}"></div><div class="col-md-6"><label class="form-label">Stipend</label><input class="form-control" th:field="*{stipend}"></div><div class="col-md-6"><label class="form-label" for="lastDate">Last date to apply</label><input id="lastDate" class="form-control" type="date" th:field="*{lastDate}" data-future-date></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="5" th:field="*{description}"></textarea></div></div><div class="d-flex flex-wrap gap-2 mt-5"><button class="btn btn-primary px-4" type="submit">Save changes</button><a class="btn btn-light border px-4" th:href="@{/admin/internships}">Cancel</a></div></form></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><th:block th:replace="~{fragments/footer :: scripts}"></th:block></body></html>
